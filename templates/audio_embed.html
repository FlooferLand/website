<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="" />
        <link rel="stylesheet" href="/assets/styles/audio_player.css" />
        <title>Audio</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #fff0;
                width: 100%;
                height: 100%;
            }
            audio {
                color-scheme: dark;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        {% if let Some(mime) = mime %}
            <audio controls autoplay>
                <source src="{{path}}" type="{{mime}}">
                Your browser does not support the audio tag!!
            </audio>
        {% else %}
            <audio controls src="{{path}}">
                Your browser does not support the audio tag!!
            </audio>
        {% endif %}
    </body>
</html>
