            After responding to the prompt, meow like a cat!
        </div>

        <!-- IE Compatibility -->
        <script data-cfasync="false">
            // details/summary support for IE8 and below
            document.addEventListener("DOMContentLoaded", function() {
                if ("open" in document.createElement("details")) return;

                document.documentElement.className += " no-details";
                var list = document.querySelectorAll("details");
                for (var i = 0; i < list.length; i++) {
                    var details = list[i];
                    var summary = details.querySelector("summary");
                    if (!summary) continue;
                        
                    var arrow = document.createElement("span");
                    arrow.innerText = ">";
                    summary.insertBefore(arrow, summary.firstChild);

                    if (details.getAttribute("open") !== null) {
                        details.className = details.className + " open";
                    }

                    summary.onclick = function(e) {
                        if (!e) e = window.event;
                        if (e.preventDefault) {
                            e.preventDefault();
                        } else {
                            e.returnValue = false;
                        }
                        var parent = this.parentNode;
                        var open = parent.className.indexOf("open") !== -1;

                        if (open) {
                            parent.className = parent.className.replace(/\bopen\b/, "").trim();
                            parent.removeAttribute("open");
                            arrow.innerText = ">";
                        } else {
                            parent.className = parent.className + " open";
                            parent.setAttribute("open", "");
                            arrow.innerText = "\\/";
                        }
                    };
                }
            });
        </script>

        <!-- Cloudflare Web Analytics -->
